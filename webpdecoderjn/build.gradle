
plugins {
    id 'java-library'
}

group = "local.webp"
version = "1.0.0"

repositories {
    mavenCentral()
}

dependencies {
    api "net.java.dev.jna:jna:5.13.0"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
